<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Calendarchy app icon</title>
  <desc id="desc">Dark neon calendar icon with purple and cyan accents, lime selected day, and striped A mark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22183f"/>
      <stop offset="55%" stop-color="#17182f"/>
      <stop offset="100%" stop-color="#111726"/>
    </linearGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d66cff"/>
      <stop offset="38%" stop-color="#8e70ff"/>
      <stop offset="72%" stop-color="#54a9ff"/>
      <stop offset="100%" stop-color="#3ff4ef"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c78cff"/>
      <stop offset="55%" stop-color="#7e57e8"/>
      <stop offset="100%" stop-color="#5642a8"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ff59"/>
      <stop offset="100%" stop-color="#9ceb48"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="limeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".38"/>
    </filter>

    <clipPath id="iconClip">
      <rect x="46" y="46" width="932" height="932" rx="160"/>
    </clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="46" y="46" width="932" height="932" rx="160" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="158" fill="none" stroke="#463c8b" stroke-width="3"/>

  <!-- Calendar body shadow -->
  <g filter="url(#shadow)">
    <rect x="185" y="225" width="654" height="604" rx="72" fill="#17192f"/>
  </g>

  <!-- Calendar outline -->
  <rect x="185" y="225" width="654" height="604" rx="72"
        fill="#1a1c34" stroke="url(#frame)" stroke-width="7"/>

  <!-- Header section -->
  <path d="M185 372 H839" stroke="#0f1022" stroke-width="18" opacity=".9"/>
  <path d="M185 372 H839" stroke="url(#frame)" stroke-width="2.5" opacity=".8"/>

  <!-- Ring holes -->
  <circle cx="348" cy="274" r="32" fill="#0f1021" stroke="#6d65b9" stroke-width="5"/>
  <circle cx="676" cy="274" r="32" fill="#0f1021" stroke="#6d65b9" stroke-width="5"/>

  <!-- Ring posts -->
  <g filter="url(#softGlow)">
    <rect x="329" y="162" width="38" height="119" rx="19" fill="url(#ring)" stroke="#a88cff" stroke-width="3"/>
    <rect x="657" y="162" width="38" height="119" rx="19" fill="url(#ring)" stroke="#a88cff" stroke-width="3"/>
  </g>

  <!-- Date grid -->
  <g fill="#3b3d5c">
    <rect x="422" y="431" width="66" height="66" rx="15"/>
    <rect x="518" y="431" width="66" height="66" rx="15"/>
    <rect x="614" y="431" width="66" height="66" rx="15"/>
    <rect x="710" y="431" width="66" height="66" rx="15"/>

    <rect x="422" y="527" width="66" height="66" rx="15"/>
    <rect x="518" y="527" width="66" height="66" rx="15"/>
    <rect x="710" y="527" width="66" height="66" rx="15"/>

    <rect x="422" y="623" width="66" height="66" rx="15"/>
    <rect x="518" y="623" width="66" height="66" rx="15"/>
    <rect x="614" y="623" width="66" height="66" rx="15"/>
    <rect x="710" y="623" width="66" height="66" rx="15"/>

    <rect x="518" y="719" width="66" height="66" rx="15"/>
  </g>

  <!-- Highlighted day -->
  <rect x="614" y="527" width="66" height="66" rx="15" fill="url(#lime)" filter="url(#limeGlow)"/>

  <!-- Stylized striped A -->
  <g stroke="#56e8ec" stroke-width="6" stroke-linecap="round">
    <path d="M323 554 H327"/>
    <path d="M317 571 H333"/>
    <path d="M309 588 H341"/>
    <path d="M302 605 H348"/>
    <path d="M294 622 H356"/>
    <path d="M286 639 H364"/>
    <path d="M279 656 H371"/>
    <path d="M270 673 H380"/>
    <path d="M262 690 H388"/>
    <path d="M253 707 H397"/>
    <path d="M245 724 H405"/>
    <path d="M237 741 H413"/>
  </g>

  <!-- carve center of A -->
  <path d="M322 636 L270 746 L315 746 L340 692 L365 746 L410 746 L358 636 Z"
        fill="#1a1c34" opacity=".96"/>

  <!-- restore outer striped legs -->
  <g stroke="#56e8ec" stroke-width="6" stroke-linecap="round">
    <path d="M253 707 H286"/>
    <path d="M245 724 H278"/>
    <path d="M237 741 H270"/>
    <path d="M364 707 H397"/>
    <path d="M372 724 H405"/>
    <path d="M380 741 H413"/>
  </g>
</svg>
