[package]
name = "calendarchy"
version.workspace = true
edition.workspace = true

[[bin]]
name = "calendarchy"
path = "src/main.rs"

[dependencies]
calendarchy-core.workspace = true
calendarchy-service-calendar.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
relm4 = { version = "0.11.0", features = ["libadwaita"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
gtk4 = { version = "0.11.4", features = ["v4_22"] }
